services:
  postgres:
    image: postgres:16-alpine
    container_name: ussd-automation-postgres
    environment:
      POSTGRES_DB: ussd_automation
      POSTGRES_USER: ussd_automation
      POSTGRES_PASSWORD: ussd_automation
    ports:
      - "5432:5432"
    volumes:
      - ussd_automation_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ussd_automation"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ussd_automation_pgdata:
