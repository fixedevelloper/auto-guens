services:
  postgres:
    image: postgres:16-alpine
    container_name: ussd-automation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    image: docker.io/${DOCKERHUB_NAMESPACE}/ussd-auto:${API_IMAGE_TAG:-latest}
    container_name: ussd-automation-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MERCHANT_API_KEY: ${MERCHANT_API_KEY}
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase-service-account.json
    volumes:
      - ${FIREBASE_CREDENTIALS_FILE}:/run/secrets/firebase-service-account.json:ro
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
